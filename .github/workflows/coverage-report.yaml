name: Code Coverage

on:
  pull_request:
  push:
    paths:
      - '!.github/**'
      - '.github/workflows/coverage-report.yaml'
    branches:
      - main

jobs:
  php-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      COMPOSER_NO_INTERACTION: 1

    name: Code Coverage Report
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Setup PHP
        uses: shivammathur/setup-php@accd6127cb78bee3e8082180cb391013d204ef9f # v2
        with:
          php-version: 8.3
          coverage: pcov
          ini-values: zend.assertions=1
          tools: composer:v2,flex

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress

      - name: Execute Unit Tests
        run: composer test:coverage

      - if: ${{ github.event_name == 'pull_request' }}
        name: Download artifact
        uses: dawidd6/action-download-artifact@1f8785ff7a5130826f848e7f72725c85d241860f # v18
        continue-on-error: true
        with:
          workflow: .github/workflows/coverage-report.yaml # this file
          branch: main
          name: coverage-report
          path: coverage/base

      - if: ${{ github.event_name != 'pull_request' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage-report
          path: coverage/clover.xml

      - name: Coverage Report as Comment (Clover)
        if: ${{ github.event_name == 'pull_request' }}
        uses: lucassabreu/comment-coverage-clover@main
        with:
          file: coverage/clover.xml
          base-file: coverage/base/clover.xml
          with-chart: false
          with-branches: false
